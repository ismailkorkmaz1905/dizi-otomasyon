name: ffmpeg kur
description: Statik ffmpeg (BtbN 8.1) GitHub cache'inden ya da github.com'dan; o da olmazsa apt (bkz. kur.sh)
runs:
  using: composite
  steps:
    - id: c   # sabit anahtar: runner image'i degisse de ayni statik ffmpeg (eskisi image surumune bagliydi, 20 Kasim'da kacti)
      uses: actions/cache/restore@v5
      with:
        path: /tmp/ffmpeg-kur
        key: ffmpeg-statik-8.1-20261119
    - id: k
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/kur.sh"
    - if: steps.k.outputs.yeni == '1'
      uses: actions/cache/save@v5
      continue-on-error: true   # paralel isler ayni anahtari ayni anda kaydetmeye calisir, biri kazanir
      with:
        path: /tmp/ffmpeg-kur
        key: ffmpeg-statik-8.1-20261119
