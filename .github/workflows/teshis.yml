name: teshis - Telegram parcalari
# Gecici: Drive'daki yakili videoyu eski yontemle boler, parcalari inceler. Telegram'a gondermez, Drive'a yazmaz.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [teshis.py]
jobs:
  incele:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ./.github/actions/ffmpeg
      - run: pip install -q google-auth requests
      - run: python3 teshis.py
        env:
          DIZI: muhtemel_ask
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
