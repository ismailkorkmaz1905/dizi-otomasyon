name: deneme-yt5
run-name: Star TV ve Show TV bolum sayfasi icerigi
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-yt5.yml']
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q -U "yt-dlp[default]"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          curl -sL -m 30 -A "$UA" -o /tmp/s.html https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum
          echo "== STAR baglam"; grep -oiE '.{0,80}(m3u8|flavors|videoUrl|video-url|playerUrl|mediaUrl|dygvideo|\.mp4).{0,160}' /tmp/s.html | head -12
          echo "== STAR __next_f video"; grep -oE 'self\.__next_f\.push\(\[1,"[^<]{0,50}' /tmp/s.html | wc -l; grep -oiE '.{0,60}video[^,]{0,100}' /tmp/s.html | grep -vi 'og:\|_next/static' | head -15
          echo "== SHOW bolum 21"
          curl -sL -m 30 -A "$UA" -o /tmp/h.html -w '%{http_code}\n' https://www.showtv.com.tr/dizi/tum_bolumler/muhtemel-ask-sezon-1-bolum-21-izle/136091
          grep -oiE '.{0,80}(m3u8|\.mp4|dygvideo|ht_stream|videoUrl|data-hope|akamai|ciner).{0,160}' /tmp/h.html | head -12
          yt-dlp -v --no-playlist -F https://www.showtv.com.tr/dizi/tum_bolumler/muhtemel-ask-sezon-1-bolum-21-izle/136091 2>&1 | grep -iE "Extracting|format|ERROR|m3u8|mp4|\|" | head -15
