name: deneme-yt8
run-name: Star TV tarayici ile akis yakalama
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-yt8.yml']
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          pip install -q playwright
          cat > /tmp/y.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          seen=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',args=['--no-sandbox','--autoplay-policy=no-user-gesture-required'])
              pg=b.new_page(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36')
              pg.on('request',lambda r: seen.append((r.method,r.url)) if re.search(r'm3u8|\.mp4|dyg|video|stream|manifest|playlist|\.mpd|api',r.url,re.I) and not re.search(r'\.(js|css|png|jpg|webp|svg|woff2?)(\?|$)',r.url) else None)
              pg.goto('https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum',wait_until='domcontentloaded')
              pg.wait_for_timeout(8000)
              try:
                  pg.evaluate("document.querySelector('video')&&document.querySelector('video').play()")
              except Exception as e: print('play',e)
              pg.wait_for_timeout(12000)
              print('video src:',pg.evaluate("[...document.querySelectorAll('video')].map(v=>v.currentSrc||v.src)"))
              b.close()
          for m,u in dict.fromkeys(seen): print(m,u[:230])
          PY
          python3 /tmp/y.py 2>&1 | tail -60
