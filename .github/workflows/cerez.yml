name: 3 - Çerez kontrol
run-name: YouTube çerez kontrolü

# Indirmeden, Scribe'a dokunmadan YouTube cerezinin hala calistigini dener; olmazsa Telegram'a yenileme tarifiyle yazar.
# Saatler UTC: her gun 02:00, Muhtemel Ask persembe 10:00 (yuklenme persembe 22:00), Baskalarinin Hayati cumartesi 11:00
# (yuklenme ~20:30). Cron gecikebilir/atlayabilir; elle de calisir.
# YouTube istekleri Cloudflare WARP uzerinden gider (.github/actions/warp): GitHub IP'leri bot engeline takiliyor.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
    - cron: '0 10 * * 4'
    - cron: '0 11 * * 6'

permissions:
  contents: read

jobs:
  cerez:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: denoland/setup-deno@v2   # yt-dlp, YouTube icin JS calistirici ister
        with:
          deno-version: v2.x
      - run: |
          sudo mkdir -p /content && sudo chown "$USER" /content
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"
      - uses: ./.github/actions/warp
      - run: python otomasyon.py cerez
        env:
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
