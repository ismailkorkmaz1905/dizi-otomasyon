name: 3 - Çerez kontrol
run-name: YouTube çerez kontrolü

# Indirmeden, Scribe'a dokunmadan YouTube cerezinin hala calistigini dener; olmazsa Telegram'a yenileme tarifiyle yazar.
# Zamanlanmis calisma yok (20 Kasim 2026, Ismail: hic cron kalmasin), sadece elle.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cerez:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: denoland/setup-deno@v2   # yt-dlp, YouTube icin JS calistirici ister
        with:
          deno-version: v2.x
      - run: |
          sudo mkdir -p /content && sudo chown "$USER" /content
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"
      - run: python otomasyon.py cerez
        env:
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
