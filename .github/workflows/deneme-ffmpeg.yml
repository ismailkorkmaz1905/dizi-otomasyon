name: Deneme - statik ffmpeg
# Gecici: yeni ffmpeg action'ini (statik BtbN) ve altyazi yakmasini dener. Test bitince silinecek.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deneme-ffmpeg.yml']
jobs:
  ilk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: echo "$(date -u +%T) basladi"
      - uses: ./.github/actions/ffmpeg
      - run: echo "$(date -u +%T) bitti"; which ffmpeg ffprobe; ffmpeg -hide_banner -version | head -1
  ikinci:   # cache'ten gelmeli
    needs: ilk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: echo "$(date -u +%T) basladi"
      - uses: ./.github/actions/ffmpeg
      - run: echo "$(date -u +%T) bitti"; which ffmpeg
      - name: Yakma
        run: |
          cd /tmp
          printf '1\n00:00:01,000 --> 00:00:09,000\n- Aku nggak tahu, Kak.\n- Kenapa kamu bilang begitu?\n\n2\n00:00:10,000 --> 00:00:19,000\nTakdir berpihak pada yang berusaha.\n' > alt.srt
          ffmpeg -v error -y -f lavfi -i testsrc2=s=1920x1080:r=25:d=20 -f lavfi -i sine=d=20 -c:v libx264 -preset ultrafast -c:a aac src.mp4
          ST='Fontname=Liberation Sans,Bold=0,Fontsize=16,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BackColour=&H99000000,BorderStyle=1,Outline=1.1,Shadow=0.6,MarginV=28,Alignment=2'
          for i in 0 1; do s=$((i * 10))
            vf="setpts=PTS+$s.000000/TB,subtitles=/tmp/alt.srt:charenc=UTF-8:force_style='$ST',setpts=PTS-STARTPTS"
            ffmpeg -v verbose -y -ss $s -i src.mp4 -frames:v 250 -an -vf "$vf" -c:v libx264 -preset medium -b:v 2.5M -maxrate 3.75M -bufsize 5M -r 25 p$i.mp4 2>&1 | grep -iE 'fontselect|font provider|error' | head -5
          done
          ffmpeg -v error -y -i p0.mp4 -vf "select=eq(n\,100)" -frames:v 1 k.png
          ffmpeg -v error -y -i src.mp4 -vf "select=eq(n\,100)" -frames:v 1 h.png
          echo "yakili vs ham PSNR (sonlu ve dusuk = altyazi cizilmis):"; ffmpeg -hide_banner -i k.png -i h.png -lavfi psnr -f null - 2>&1 | grep -o 'average:[^ ]*'
          printf "file 'p0.mp4'\nfile 'p1.mp4'\n" > l.txt
          ffmpeg -v error -y -f concat -safe 0 -i l.txt -c copy b.mp4 && ffprobe -v error -show_entries format=duration -of csv=p=0 b.mp4
          ffmpeg -v error -y -i src.mp4 -vn -ac 1 -ar 16000 a.wav && ls -la a.wav
