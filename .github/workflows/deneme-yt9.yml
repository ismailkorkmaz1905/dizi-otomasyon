name: deneme-yt9
run-name: Star TV m3u8 yakala ve indir
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-yt9.yml']
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          pip install -q playwright "yt-dlp[default]"
          cat > /tmp/y.py <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          found=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',args=['--no-sandbox','--autoplay-policy=no-user-gesture-required'])
              pg=b.new_page(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36')
              pg.on('request',lambda r: found.append(r.url) if 'playlist.m3u8' in r.url else None)
              pg.goto('https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum',wait_until='domcontentloaded')
              pg.wait_for_timeout(8000)
              try: pg.evaluate("document.querySelector('video')&&document.querySelector('video').play()")
              except Exception as e: print('play',e)
              for _ in range(30):
                  if found: break
                  pg.wait_for_timeout(1000)
              b.close()
          open('/tmp/m3u8.txt','w').write(found[0] if found else '')
          print('bulundu:',len(found))
          PY
          python3 /tmp/y.py
          M=$(cat /tmp/m3u8.txt); echo "${M%%\?*}"
          echo "== -F"; yt-dlp -F "$M" 2>&1 | tail -12
          echo "== 40 sn indir"; yt-dlp -f 'bv*+ba/b' --download-sections '*0-40' -o /tmp/s.mp4 "$M" 2>&1 | tail -4; ls -la /tmp/s.mp4
          echo "== tokensiz (st/e atilmis)"; curl -s -m 15 -o /dev/null -w '%{http_code}\n' "${M%%\?*}"
