name: deneme-yt4
run-name: Star TV ve Show TV oynatici kesfi
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-yt4.yml']
permissions:
  contents: read
jobs:
  kaynak:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q -U "yt-dlp[default]"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          U=https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum
          curl -sL -m 30 -A "$UA" -o /tmp/s.html "$U"
          echo "== STAR anahtarlar"; grep -oiE '"[A-Za-z]*(video|media|stream|hls|m3u8|dyg|reference|publisher)[A-Za-z]*":"?[^,}]{0,140}' /tmp/s.html | sort -u | head -40
          echo "== STAR dyg/cdn"; grep -oiE 'https?:[^"'"'"' <>\\]*(dyg|dogus|cdn|vod|stream|media)[^"'"'"' <>\\]{0,120}' /tmp/s.html | sort -u | head -25
          echo "== yt-dlp startv -v"; yt-dlp -v --no-playlist -F "$U" 2>&1 | grep -iE "startv|Extractor|player|api|error" | head -12
          echo "== SHOW muhtemel ask sayfalari"; curl -sL -m 30 -A "$UA" https://www.showtv.com.tr/dizi/haber/3927107-muhtemel-ask-21-bolumuyle-seyirciyle-bulustu | grep -oE 'href="/dizi/[^"]*muhtemel[^"]*"' | sort -u | head -10
          curl -sL -m 30 -A "$UA" -o /tmp/h.html -w '%{http_code}\n' https://www.showtv.com.tr/dizi/muhtemel-ask/bolumler/136092 ; grep -oE 'href="[^"]*muhtemel-ask[^"]*"' /tmp/h.html | sort -u | head -10
