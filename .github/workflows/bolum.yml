name: 1 - Bölüm hazırla
run-name: >-
  ${{ format('{0}{1} - {2}', inputs.dizi == 'yeralti' && 'Yeraltı' || inputs.dizi == 'baskalarinin_hayati' && 'Başkalarının Hayatı' || 'Muhtemel Aşk',
                inputs.bolum && format(' {0}', inputs.bolum) || '',
                inputs.is == 'kontrol' && 'kurulum kontrolü' || inputs.is == 'saatler' && 'yükleme saatleri' || inputs.is == 'temizlik' && 'temizlik' || 'elle hazırlama') }}

# YouTube'a bakar, yeni bolum varsa indirir, Scribe ile Turkce metni cikarir, ceviri girdisini bolumler/ altina koyar.
# 6 Kasim 2026: zamanlanmis (cron) tetikleyiciler kaldirildi, yalnizca elle calisir (workflow_dispatch).
# Elle: "kontrol" kurulumu dener (bir sey gondermez, kredi harcamaz), "saatler" gecmis yukleme saatlerini yazar.
on:
  workflow_dispatch:
    inputs:
      is:
        type: choice
        options: [hazirla, kontrol, saatler, temizlik]
        default: hazirla
      dizi:
        type: choice
        options: [muhtemel_ask, yeralti, baskalarinin_hayati]
        default: muhtemel_ask
      bolum:
        description: 'Bos: siradaki bolum. Ornek: 18'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: bolum-${{ inputs.dizi || 'muhtemel_ask' }}

jobs:
  hazirla:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIZI: ${{ inputs.dizi || 'muhtemel_ask' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: denoland/setup-deno@v2   # yt-dlp, YouTube icin JS calistirici ister
        with:
          deno-version: v2.x
      - uses: ./.github/actions/ffmpeg   # .deb'ler cache'ten; Azure mirror'i bazen 60 KB/sn
      - run: |
          sudo mkdir -p /content && sudo chown "$USER" /content
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"
      - id: h
        run: python otomasyon.py ${{ inputs.is || 'hazirla' }}
        env:
          GDRIVE_SA: ${{ secrets.GDRIVE_SA }}
          GDRIVE_OAUTH: ${{ secrets.GDRIVE_OAUTH }}
          BOLUM: ${{ inputs.bolum }}
      - if: always() && steps.h.outputs.anahtar != ''   # yakma isi videoyu tekrar indirmesin (Drive'a yazma hata verse de)
        uses: actions/cache/save@v5
        with:
          path: /tmp/video
          key: ${{ steps.h.outputs.anahtar }}
          
