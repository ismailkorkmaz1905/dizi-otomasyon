name: deneme-warp
run-name: YouTube cerezsiz - Cloudflare WARP
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-warp.yml']
permissions:
  contents: read
env:
  VID: https://www.youtube.com/watch?v=eGJjWJ__cBw
jobs:
  warp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ffmpeg
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: |
          pip install -q -U "yt-dlp[default]"
          cd /tmp
          curl -sL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.29/wgcf_2.2.29_linux_amd64 && chmod +x wgcf
          curl -sL -o w.tgz https://github.com/pufferffish/wireproxy/releases/download/v1.0.9/wireproxy_linux_amd64.tar.gz && tar xzf w.tgz
          ./wgcf register --accept-tos >/dev/null 2>&1; ./wgcf generate >/dev/null 2>&1; ls wgcf-profile.conf
          printf '\n[Socks5]\nBindAddress = 127.0.0.1:25344\n' >> wgcf-profile.conf
          nohup ./wireproxy -c wgcf-profile.conf >/tmp/wp.log 2>&1 &
          sleep 6
          echo "WARP cikis:"; curl -s --socks5-hostname 127.0.0.1:25344 https://ipinfo.io/org; echo
          P="--proxy socks5://127.0.0.1:25344"
          echo "== formatlar"; yt-dlp $P --no-playlist -F "$VID" 2>&1 | grep -E "^[0-9]+ .*(mp4|webm|m4a)" | awk '{print $1,$2,$3,$4,$5}' | head -25
          echo "== 1080p h264 + ses, 3 dk"
          ( time yt-dlp $P --no-playlist -f 'bv*[height<=1080][vcodec^=avc1]+140/bv*[height<=1080]+ba/b' --download-sections '*600-780' -o /tmp/t.mp4 "$VID" 2>&1 | grep -E "ERROR|Downloading 1 format|100%" | head -4 ) 2>&1 | grep -E "real|format|ERROR|100%"
          ls -la /tmp/t.mp4; ffprobe -v error -show_entries stream=codec_name,width,height,bit_rate -of compact /tmp/t.mp4
          echo "== proxy'siz kontrol"; yt-dlp --no-playlist --simulate "$VID" 2>&1 | grep -c "not a bot"
