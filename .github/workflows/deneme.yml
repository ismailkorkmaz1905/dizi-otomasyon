name: 9 - Kaynak denemesi
run-name: Kaynak denemesi (indirmez, kredi harcamaz)

# Gecici: YouTube cerezi olmadan hangi kaynak/istemci calisiyor, sadece format listesi alir.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U "yt-dlp[default]"
      - name: Star TV sayfasi
        continue-on-error: true
        run: |
          for u in https://www.startv.com.tr/dizi/baskalarinin-hayati https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum; do
            echo "=== $u"
            curl -sS -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130 Safari/537.36" -o p.html -w "%{http_code} %{size_download} %{url_effective}\n" "$u" || true
            grep -oE '<title>[^<]*' p.html | head -1
            grep -oE '/dizi/baskalarinin-hayati/[a-z0-9/-]*' p.html | sort -u | head -25
            grep -oE '[^" ]*(m3u8|\.mp4|videoUrl|referenceId|video-id|player)[^" ]{0,120}' p.html | sort -u | head -25 | cut -c1-240
          done
