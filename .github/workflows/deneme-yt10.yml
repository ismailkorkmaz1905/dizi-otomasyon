name: deneme-yt10
run-name: Show TV ve Star TV tam akis olcumu
on:
  push:
    branches: [claude/project-thread-r1c6ze]
    paths: ['.github/workflows/deneme-yt10.yml']
permissions:
  contents: read
jobs:
  olcum:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ffmpeg
      - run: |
          pip install -q playwright
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36'
          echo "== SHOW liste"; curl -sL -m 30 -A "$UA" https://www.showtv.com.tr/dizi/tum_bolumler/muhtemel-ask/3072 -o /tmp/l.html -w '%{http_code}\n'; grep -oE 'href="/dizi/tum_bolumler/muhtemel-ask-sezon[^"]*"' /tmp/l.html | sort -u | head -5
          M=https://vmcdn.ciner.com.tr/ht/2026/11/12/41DEEABD9480EA5B566DCCBDDFAF8998_1920x1080.mp4
          echo "== SHOW ffprobe"; ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,width,height -of compact "$M"
          echo "== SHOW ortadan 60 sn (HTTP seek)"; /usr/bin/time -f '%e sn' ffmpeg -v error -ss 4000 -i "$M" -t 60 -c copy -y /tmp/a.mp4; ls -la /tmp/a.mp4
          echo "== SHOW sesi cikar (tam, 4 dk icinde mi)"; ( time timeout 600 ffmpeg -v error -i "$M" -vn -c:a copy -y /tmp/ses.m4a ) 2>&1 | grep real; ls -la /tmp/ses.m4a
          cat > /tmp/y.py <<'PY'
          from playwright.sync_api import sync_playwright
          f=[]
          with sync_playwright() as p:
              b=p.chromium.launch(channel='chrome',args=['--no-sandbox','--autoplay-policy=no-user-gesture-required'])
              pg=b.new_page(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36')
              pg.on('request',lambda r: f.append(r.url) if 'playlist.m3u8' in r.url else None)
              pg.goto('https://www.startv.com.tr/dizi/baskalarinin-hayati/bolumler/7-bolum',wait_until='domcontentloaded')
              pg.wait_for_timeout(6000)
              try: pg.evaluate("document.querySelector('video')&&document.querySelector('video').play()")
              except Exception: pass
              for _ in range(30):
                  if f: break
                  pg.wait_for_timeout(1000)
              b.close()
          open('/tmp/m3u8.txt','w').write(f[0] if f else '')
          PY
          python3 /tmp/y.py; S=$(cat /tmp/m3u8.txt)
          echo "== STAR ffprobe"; ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,bit_rate -of compact "$S" | head -6
          echo "== STAR 10 dk indir (-c copy)"; ( time ffmpeg -v error -i "$S" -t 600 -map 0:v:1? -map 0:a:0? -c copy -y /tmp/b.mp4 ) 2>&1 | grep real; ls -la /tmp/b.mp4
